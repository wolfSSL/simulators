name: TROPIC01 hardware conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  conformance:
    name: simulator vs. recorded hardware behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build conformance image
        uses: docker/build-push-action@v6
        with:
          context: TROPIC01Sim
          file: TROPIC01Sim/Dockerfile.conformance
          tags: tropic01-conformance:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compare with the hardware baselines
        run: docker run --rm tropic01-conformance:ci
